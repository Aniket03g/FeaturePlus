<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF--8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeaturePlus Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // FeaturePlus design tokens (see backend/templates/DESIGN.md).
    // CDN Tailwind has no config file, so brand tokens are defined inline.
    // This also revives the many existing `primary-*` utility classes that
    // were previously inert (Tailwind has no default `primary` palette).
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Brand / primary accent (indigo scale)
            primary: {
              50:  '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81',
            },
            brand: {
              50:  '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81',
            },
          },
          borderRadius: { xl: '0.75rem', '2xl': '1rem' },
          boxShadow: {
            card: '0 1px 2px 0 rgb(0 0 0 / 0.04), 0 1px 3px 0 rgb(0 0 0 / 0.08)',
            'card-hover': '0 4px 12px 0 rgb(0 0 0 / 0.08), 0 2px 4px 0 rgb(0 0 0 / 0.04)',
          },
        },
      },
    };
  </script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="/static/js/auth.js"></script>
  <script src="/static/js/share-modal.js"></script>
</head>

      <li>

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>

        </a>
      </li>
      <li>

            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>

      </li>

          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />

          </svg>

      {{ end }}
      <li class="mt-4 text-sm font-semibold text-gray-500">Projects</li>
      {{ range .Projects }}
        <li><a href="/web/projects/{{ .ID }}" class="py-1 px-3 rounded hover:bg-gray-100 block ml-2">{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </aside>
  <div class="flex-1 flex flex-col bg-gray-50">
    <!-- Modal container for HTMX modals -->
    <div id="modal-container"></div>
    <header>
      <div class="flex items-center justify-between h-16 px-6 bg-white border-b border-gray-200">
        <div class="flex-1"></div>
        <div class="flex-none">
          <div class="form-control">
            <input type="text" placeholder="Search..." class="block w-full max-w-xs px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-sm" />
          </div>
        </div>
        <div class="flex-none ml-4">
          <div class="relative" x-data="{ open: false }">
            <button @click="open = !open" @blur="open = false" class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-100 hover:bg-gray-200 focus:outline-none focus:ring-2 focus:ring-primary-500 cursor-pointer">
              <span class="sr-only">Open user menu</span>
              <div class="w-10 rounded-full">
                <img src="https://i.pravatar.cc/100?img=3" alt="User avatar" />
              </div>
            </button>
            <ul x-show="open" @click.away="open = false" class="absolute right-0 mt-2 w-52 bg-white border border-gray-200 rounded-lg shadow-lg py-2 z-50" x-transition>
              <li><a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Profile</a></li>
              <li><a href="#" class="block px-4 py-2 text-gray-700 hover:bg-gray-100" onclick="Auth.logout(); return false;">Logout</a></li>
            </ul>
          </div>
        </div>
      </div>
    </header>
    <main id="main-content" class="flex-1 p-6" hx-get="{{ .InitialURL }}" hx-trigger="load" hx-headers='js:{"Authorization": "Bearer " + (window.Auth ? window.Auth.getToken() : "")}'></main>
  </div>
</body>
<script>
    // Note: The global HTMX request hook is now handled in login.html
    // This script is for dashboard-specific functionality

    // Debounce utility
    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    function tagInput() {
      return {
        input: '',
        tags: [],
        suggestions: [],
        showDropdown: false,
        async fetchSuggestions() {
          if (this.input.length < 2) {
            this.suggestions = [];
            this.showDropdown = false;
            return;
          }
          const resp = await fetch(`/web/fragments/tags/autocomplete?query=${encodeURIComponent(this.input)}`, {
            headers: { 'HX-Request': 'true' }
          });
          this.suggestions = await resp.json();
          this.showDropdown = this.suggestions.length > 0;
        },
        debouncedFetchSuggestions: null,
        addTag(tag) {
          tag = (tag || this.input).trim().replace(/[,;]$/, '');
          if (tag) {
            tag.split(/[,;\s]+/).forEach(t => {
              t = t.trim();
              if (t && !this.tags.includes(t)) this.tags.push(t);
            });
          }
          this.input = '';
          this.suggestions = [];
          this.showDropdown = false;
        },
        removeTag(idx) {
          this.tags.splice(idx, 1);
        },
        onInput() {
          if (!this.debouncedFetchSuggestions) {
            this.debouncedFetchSuggestions = debounce(this.fetchSuggestions.bind(this), 4000);
          }
          this.debouncedFetchSuggestions();
        },
        onKeydown(e) {
          if ([',', ';', ' '].includes(e.key)) {
            e.preventDefault();
            this.addTag();
          }
        },
        selectSuggestion(tag) {
          this.addTag(tag);
        }
      }
    }
    function tagInputEdit(initialTags) {
      let tags = [];
      if (Array.isArray(initialTags)) {
        tags = initialTags.map(t => typeof t === "string" ? t : (t.tag_name || ""));
      }
      return {
        input: '',
        tags: tags,
        suggestions: [],
        showDropdown: false,
        async fetchSuggestions() {
          if (this.input.length < 2) {
            this.suggestions = [];
            this.showDropdown = false;
            return;
          }
          const resp = await fetch(`/web/fragments/tags/autocomplete?query=${encodeURIComponent(this.input)}`, {
            headers: { 'HX-Request': 'true' }
          });
          this.suggestions = await resp.json();
          this.showDropdown = this.suggestions.length > 0;
        },
        debouncedFetchSuggestions: null,
        addTag(tag) {
          tag = (tag || this.input).trim().replace(/[,;]$/, '');
          if (tag) {
            tag.split(/[,;\s]+/).forEach(t => {
              t = t.trim();
              if (t && !this.tags.includes(t)) this.tags.push(t);
            });
          }
          this.input = '';
          this.suggestions = [];
          this.showDropdown = false;
        },
        removeTag(idx) {
          this.tags.splice(idx, 1);
        },
        onInput() {
          if (!this.debouncedFetchSuggestions) {
            this.debouncedFetchSuggestions = debounce(this.fetchSuggestions.bind(this), 6000);
          }
          this.debouncedFetchSuggestions();
        },
        onKeydown(e) {
          if ([',', ';', ' '].includes(e.key)) {
            e.preventDefault();
            this.addTag();
          }
        },
        selectSuggestion(tag) {
          this.addTag(tag);
        }
      }
    }
    // Ensure Alpine re-inits after htmx swaps
    if (window.Alpine) {
      document.body.addEventListener('htmx:afterSwap', () => {
        window.Alpine.initTree(document.body);
      });
    }
</script>
</html>
